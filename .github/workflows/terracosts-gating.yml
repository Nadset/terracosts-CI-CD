name: TerraCosts FinOps CI/CD Gating

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'terraform/**'

jobs:
  finops-gating:
    name: Multi-Cloud Budget & Tag Governance
    runs-on: self-hosted

    strategy:
      fail-fast: false
      matrix:
        include:
          - project_name: "Production-API"
            provider: "aws"
            working_dir: "terraform/aws"
            plan_path: "plan.json"
          - project_name: "Frontend-App"
            provider: "azure"
            working_dir: "terraform/azure"
            plan_path: "plan.json"
          - project_name: "Data-Pipeline"
            provider: "oci"
            working_dir: "terraform/oci"
            plan_path: "plan.json"
          - project_name: "Core-Backend"
            provider: "gcp"
            working_dir: "terraform/gcp"
            plan_path: "plan.json"

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check Changed Files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: ${{ matrix.working_dir }}/**

      - name: Ensure Terraform Plan Artifact Exists
        if: steps.changed-files.outputs.any_changed == 'false'
        run: |
          echo "No changes detected for ${{ matrix.provider }}. Generating a fallback mock structure..."
          echo '{"format_version": "1.0", "planned_values": {"root_module": {"resources": []}}}' > ${{ github.workspace }}/${{ matrix.plan_path }}

      - name: Terraform Init and Plan
        if: steps.changed-files.outputs.any_changed == 'true'
        working-directory: ${{ matrix.working_dir }}
        run: |
          echo "INFO: Structural changes detected for ${{ matrix.provider }}. Launching infrastructure plan..."
          terraform init
          terraform plan -out=tfplan.binary

      - name: Export Infrastructure Architecture to JSON Ledger
        if: steps.changed-files.outputs.any_changed == 'true'
        working-directory: ${{ matrix.working_dir }}
        run: |
          terraform show -json tfplan.binary > ${{ github.workspace }}/${{ matrix.plan_path }}

      # 🛡️ Governance Execution via Docker Container
      - name: Execute FinOps Gate Analysis & Sync Telemetry
        run: |
          echo "Executing production FinOps analysis for ${{ matrix.project_name }} [Cloud: ${{ matrix.provider }}]..."
          
          # 1. Copie du plan généré dans le conteneur
          docker cp ${{ github.workspace }}/${{ matrix.plan_path }} terracosts-engine:/app/${{ matrix.plan_path }}

          # 2. Exécution du gating à l'intérieur du conteneur
          docker exec \
            -e TERRACOSTS_API_KEY="${TERRACOSTS_API_KEY}" \
            -e TERRACOSTS_API_URL="http://127.0.0.1:8000" \
            -e FINOPS_STRICT_MODE="true" \
            -e CI_PLATFORM="github_actions" \
            -e EXECUTOR_ENGINE="github_actions" \
            -e GITHUB_ACTIONS="true" \
            terracosts-engine \
            python3 /app/scripts/finops_gating.py \
              --plan "/app/${{ matrix.plan_path }}" \
              --project "${{ matrix.project_name }}" \
              --provider "${{ matrix.provider }}"

      - name: Cleanup Temporary Plan in Container
        if: always()
        run: |
          docker exec terracosts-engine rm -f /app/${{ matrix.plan_path }}
