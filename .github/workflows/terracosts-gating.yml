name: TerraCosts FinOps Gating

on:
  push:
    branches: [ main ]
    paths: [ 'terraform/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'terraform/**' ]

jobs:
  finops-gating:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init and Plan
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform plan -input=false -out=tfplan.binary
          terraform show -json tfplan.binary > "${{ github.workspace }}/plan.json"

      - name: TerraCosts Gate (API)
        env:
          TERRACOSTS_API_KEY: ${{ secrets.TERRACOSTS_API_KEY }}
          TERRACOSTS_API_URL: ${{ secrets.TERRACOSTS_API_URL || 'https://terracosts.com' }}
        run: |
          set -euo pipefail
          jq -n \
            --slurpfile plan "${{ github.workspace }}/plan.json" \
            --arg project "Production-API" \
            --arg provider "aws" \
            --arg branch "${{ github.ref_name }}" \
            '{
              plan: $plan[0],
              project: $project,
              provider: $provider,
              branch: $branch,
              organization: "Research & Development",
              bu: "BU Core Payment",
              ci_platform: "github_actions",
              strict_mode: true
            }' > /tmp/gating-body.json

          HTTP_BODY=$(curl -sS -X POST "$TERRACOSTS_API_URL/api/gating/analyze" \
            -H "Authorization: Bearer $TERRACOSTS_API_KEY" \
            -H "Content-Type: application/json" \
            -d @/tmp/gating-body.json)
          echo "$HTTP_BODY" | jq .
          exit "$(echo "$HTTP_BODY" | jq -r '.exit_code // 1')"
