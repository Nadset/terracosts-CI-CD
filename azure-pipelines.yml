# TerraCosts FinOps CI/CD Gating — Azure DevOps (API-first, no docker, no Marketplace task)
#
# Pipeline variables (mark TERRACOSTS_API_KEY as secret):
#   TERRACOSTS_API_KEY  = JWT
#   TERRACOSTS_API_URL  = https://terracosts.com  (optional)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**

pool:
  vmImage: 'ubuntu-latest'
  # Self-hosted alternative:
  # name: 'Default'

strategy:
  matrix:
    Production-API:
      project_name: 'Production-API'
      provider: 'aws'
      working_dir: 'terraform/aws'
    Frontend-App:
      project_name: 'Frontend-App'
      provider: 'azure'
      working_dir: 'terraform/azure'
    Data-Pipeline:
      project_name: 'Data-Pipeline'
      provider: 'oci'
      working_dir: 'terraform/oci'
    Core-Backend:
      project_name: 'Core-Backend'
      provider: 'gcp'
      working_dir: 'terraform/gcp'

variables:
  - name: TERRACOSTS_API_URL
    value: 'https://terracosts.com'

steps:
  - checkout: self
    fetchDepth: 2
    displayName: 'Checkout'

  - script: |
      set -euo pipefail
      CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
      if echo "$CHANGED_FILES" | grep -q "^$(working_dir)/"; then
        echo "##vso[task.setvariable variable=ANY_CHANGED]true"
        echo "Changes detected under $(working_dir)"
      else
        echo "##vso[task.setvariable variable=ANY_CHANGED]false"
        echo "No changes under $(working_dir)"
      fi
    displayName: 'Detect infrastructure changes'

  - script: |
      set -euo pipefail
      PLAN="$(Build.SourcesDirectory)/plan-$(provider).json"
      echo '{"format_version":"1.0","resource_changes":[]}' > "$PLAN"
      echo "Fallback empty plan written to $PLAN"
    condition: eq(variables['ANY_CHANGED'], 'false')
    displayName: 'Fallback empty Terraform plan'

  # Install Terraform + jq via script (no Marketplace TerraformInstaller task)
  - script: |
      set -euo pipefail
      if ! command -v jq >/dev/null 2>&1; then
        sudo apt-get update -y
        sudo apt-get install -y jq unzip curl
      fi
      if ! command -v terraform >/dev/null 2>&1; then
        TF_VERSION=1.9.0
        curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o /tmp/tf.zip
        sudo unzip -o /tmp/tf.zip -d /usr/local/bin
        sudo chmod +x /usr/local/bin/terraform
      fi
      terraform version
      jq --version
    condition: eq(variables['ANY_CHANGED'], 'true')
    displayName: 'Install Terraform and jq'

  - script: |
      set -euo pipefail
      PLAN="$(Build.SourcesDirectory)/plan-$(provider).json"
      cd "$(working_dir)"
      terraform init -input=false
      terraform plan -input=false -out=tfplan.binary
      terraform show -json tfplan.binary > "$PLAN"
      echo "Plan exported to $PLAN"
    condition: eq(variables['ANY_CHANGED'], 'true')
    displayName: 'Terraform Init, Plan, Export JSON'

  - script: |
      set -euo pipefail
      PLAN="$(Build.SourcesDirectory)/plan-$(provider).json"
      test -f "$PLAN"

      API_URL="${TERRACOSTS_API_URL:-https://terracosts.com}"
      API_KEY="${TERRACOSTS_API_KEY:-}"

      if [ -z "$API_KEY" ]; then
        echo "ERROR: pipeline secret variable TERRACOSTS_API_KEY is not set"
        echo "Pipelines → Edit → Variables → TERRACOSTS_API_KEY (secret)"
        exit 1
      fi

      if ! command -v jq >/dev/null 2>&1; then
        sudo apt-get update -y && sudo apt-get install -y jq
      fi

      jq -n \
        --slurpfile plan "$PLAN" \
        --arg project "$(project_name)" \
        --arg provider "$(provider)" \
        --arg branch "$(Build.SourceBranchName)" \
        '{
          plan: $plan[0],
          project: $project,
          provider: $provider,
          branch: $branch,
          organization: "Research & Development",
          bu: "BU Core Payment",
          ci_platform: "azure_devops",
          strict_mode: true
        }' > /tmp/gating-body.json

      echo "Calling $API_URL/api/gating/analyze for $(project_name)..."
      HTTP_BODY=$(curl -sS -X POST "$API_URL/api/gating/analyze" \
        -H "Authorization: Bearer $API_KEY" \
        -H "X-TerraCosts-API-Key: $API_KEY" \
        -H "Content-Type: application/json" \
        -d @/tmp/gating-body.json)

      echo "$HTTP_BODY" | jq .

      EXIT_CODE=$(echo "$HTTP_BODY" | jq -r '.exit_code // 1')
      VERDICT=$(echo "$HTTP_BODY" | jq -r '.verdict // .status // "FAILED"')
      echo "Verdict=$VERDICT exit_code=$EXIT_CODE"
      exit "$EXIT_CODE"
    env:
      TERRACOSTS_API_KEY: $(TERRACOSTS_API_KEY)
      TERRACOSTS_API_URL: $(TERRACOSTS_API_URL)
    displayName: 'TerraCosts Gate (API)'
