trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**

pool:
  name: 'Default'

strategy:
  matrix:
    Production-API:
      project_name: 'Production-API'
      provider: 'aws'
      working_dir: 'terraform/aws'
      plan_path: 'plan.json'
    Frontend-App:
      project_name: 'Frontend-App'
      provider: 'azure'
      working_dir: 'terraform/azure'
      plan_path: 'plan.json'
    Data-Pipeline:
      project_name: 'Data-Pipeline'
      provider: 'oci'
      working_dir: 'terraform/oci'
      plan_path: 'plan.json'
    Core-Backend:
      project_name: 'Core-Backend'
      provider: 'gcp'
      working_dir: 'terraform/gcp'
      plan_path: 'plan.json'

steps:
- checkout: self
  fetchDepth: 2
  displayName: 'Checkout Repository Code'

- script: |
    CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
    if echo "$CHANGED_FILES" | grep -q "^$(working_dir)/"; then
      echo "##vso[task.setvariable variable=ANY_CHANGED]true"
    else
      echo "##vso[task.setvariable variable=ANY_CHANGED]false"
    fi
  displayName: 'Verify Infrastructure Changes'

- script: |
    echo '{"format_version": "1.0", "resource_changes": []}' > $(Build.SourcesDirectory)/$(plan_path)
  condition: eq(variables['ANY_CHANGED'], 'false')
  displayName: 'Ensure Fallback Terraform Plan Ledger Exists'

- script: |
    cd $(working_dir)
    terraform init
    terraform plan -out=tfplan.binary
    terraform show -json tfplan.binary > $(Build.SourcesDirectory)/$(plan_path)
  condition: eq(variables['ANY_CHANGED'], 'true')
  displayName: 'Terraform Live Init, Plan and Export Ledger'

- script: |
    echo "Executing production FinOps analysis for $(project_name) [Cloud: $(provider)]..."

    # 1. Copie du plan généré dans le conteneur
    docker cp $(Build.SourcesDirectory)/$(plan_path) terracosts-engine:/app/$(plan_path)

    # 2. Exécution du gating à l'intérieur du conteneur
    docker exec \
      -e TERRACOSTS_API_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJuYWRlci5zZXRheWVzaEBob3RtYWlsLmNvbSIsInVzZXJfaWQiOjEsInBsYW4iOiJlbnRlcnByaXNlIiwiZXhwIjoxNzgzMjg4MzQ3LCJpYXQiOjE3ODMyMDE5NDcsImlzcyI6IlRlcnJhQ29zdHMtU2FhUyJ9.mSItEsINrl5MhUoFIsGCRyAdNUys2Q0FZja9-Mn1mXM" \
      -e TERRACOSTS_API_URL="http://127.0.0.1:8000" \
      -e FINOPS_STRICT_MODE="true" \
      -e CI_PLATFORM="azure_devops" \
      -e EXECUTOR_ENGINE="azure_devops" \
      -e TF_BUILD="True" \
      terracosts-engine \
      python3 /app/scripts/finops_gating.py \
        --plan "/app/$(plan_path)" \
        --project "$(project_name)" \
        --provider "$(provider)"
  displayName: 'Execute FinOps Gate Analysis & Sync Telemetry'

- script: |
    docker exec terracosts-engine rm -f /app/$(plan_path)
  condition: always()
  displayName: 'Cleanup Temporary Plan in Container'