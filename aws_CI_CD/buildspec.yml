# TerraCosts FinOps CI/CD Gating — AWS CodeBuild (API-first, no docker exec)
#
# CodeBuild project environment:
#   TERRACOSTS_API_KEY  (Secrets Manager / SSM recommended)
#   TERRACOSTS_API_URL  = https://terracosts.com  (optional)
#
# Optional: set CODEBUILD_MATRIX_ONLY=aws to run a single provider.
# Default runs all four stacks sequentially (CodeBuild has no native matrix).

version: 0.2

env:
  variables:
    TERRACOSTS_API_URL: "https://terracosts.com"
    # TERRACOSTS_API_KEY must be injected as a secret env var on the project
  # parameter-store:
  #   TERRACOSTS_API_KEY: /terracosts/api-key

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing Terraform and jq..."
      - yum install -y jq unzip curl || (apt-get update && apt-get install -y jq unzip curl)
      - |
        TF_VERSION=1.9.0
        curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o /tmp/tf.zip
        unzip -o /tmp/tf.zip -d /usr/local/bin
        terraform version

  pre_build:
    commands:
      - |
        if [ -z "${TERRACOSTS_API_KEY:-}" ]; then
          echo "ERROR: TERRACOSTS_API_KEY is not set"
          exit 1
        fi
      - export TERRACOSTS_API_URL="${TERRACOSTS_API_URL:-https://terracosts.com}"
      - echo "API URL=$TERRACOSTS_API_URL"

  build:
    commands:
      - |
        set -euo pipefail

        # Matrix definition (same as GitHub Actions)
        # format: project|provider|dir
        MATRIX=(
          "Production-API|aws|terraform/aws"
          "Frontend-App|azure|terraform/azure"
          "Data-Pipeline|oci|terraform/oci"
          "Core-Backend|gcp|terraform/gcp"
        )

        # Optional filter: CODEBUILD_MATRIX_ONLY=aws|azure|gcp|oci
        FILTER="${CODEBUILD_MATRIX_ONLY:-}"

        FAILED=0

        for ROW in "${MATRIX[@]}"; do
          IFS='|' read -r PROJECT PROVIDER DIR <<< "$ROW"

          if [ -n "$FILTER" ] && [ "$FILTER" != "$PROVIDER" ]; then
            echo "Skip $PROJECT ($PROVIDER) — filter=$FILTER"
            continue
          fi

          echo "============================================================"
          echo "Gating: $PROJECT / $PROVIDER / $DIR"
          echo "============================================================"

          PLAN_FILE="${CODEBUILD_SRC_DIR:-$PWD}/plan-${PROVIDER}.json"

          if [ ! -d "$DIR" ]; then
            echo "Directory $DIR missing — empty plan"
            echo '{"format_version":"1.0","resource_changes":[]}' > "$PLAN_FILE"
          else
            # Detect changes vs previous commit when possible
            CHANGED=yes
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              if ! git diff --name-only HEAD~1 HEAD -- "$DIR" | grep -q .; then
                CHANGED=no
              fi
            fi

            if [ "$CHANGED" = "yes" ]; then
              (
                cd "$DIR"
                terraform init -input=false
                terraform plan -input=false -out=tfplan.binary
                terraform show -json tfplan.binary > "$PLAN_FILE"
              )
            else
              echo "No changes in $DIR — empty plan"
              echo '{"format_version":"1.0","resource_changes":[]}' > "$PLAN_FILE"
            fi
          fi

          BRANCH="${CODEBUILD_WEBHOOK_HEAD_REF:-${CODEBUILD_SOURCE_VERSION:-main}}"
          BRANCH="${BRANCH#refs/heads/}"

          jq -n \
            --slurpfile plan "$PLAN_FILE" \
            --arg project "$PROJECT" \
            --arg provider "$PROVIDER" \
            --arg branch "$BRANCH" \
            '{
              plan: $plan[0],
              project: $project,
              provider: $provider,
              branch: $branch,
              organization: "Research & Development",
              bu: "BU Core Payment",
              ci_platform: "aws_codebuild",
              strict_mode: true
            }' > "/tmp/gating-body-${PROVIDER}.json"

          HTTP_BODY=$(curl -sS -X POST "${TERRACOSTS_API_URL}/api/gating/analyze" \
            -H "Authorization: Bearer ${TERRACOSTS_API_KEY}" \
            -H "X-TerraCosts-API-Key: ${TERRACOSTS_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @"/tmp/gating-body-${PROVIDER}.json")

          echo "$HTTP_BODY" | jq .
          EXIT_CODE=$(echo "$HTTP_BODY" | jq -r '.exit_code // 1')
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAILED gating for $PROJECT"
            FAILED=1
          else
            echo "PASSED gating for $PROJECT"
          fi
        done

        if [ "$FAILED" -ne 0 ]; then
          echo "One or more gates failed"
          exit 1
        fi
        echo "All gates passed"

  post_build:
    commands:
      - echo "TerraCosts CodeBuild gating finished"

artifacts:
  files:
    - 'plan-*.json'
  discard-paths: yes
